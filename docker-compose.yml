services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: resume, POSTGRES_PASSWORD: resume, POSTGRES_DB: resume_screening}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resume"]
      interval: 5s
      retries: 10

  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://resume:resume@db:5432/resume_screening
      STORAGE_DIR: /app/storage
    volumes: [resumes:/app/storage, ./ml/artifacts:/app/ml/artifacts]
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]

  frontend:
    build: .
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment: {API_URL: "http://backend:8000"}
    depends_on: [backend]
    ports: ["8501:8501"]

volumes:
  pgdata:
  resumes:
