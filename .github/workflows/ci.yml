name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - name: Lint
        run: ruff check backend frontend ml tests --select E,F --ignore E501,E701,E702
      - name: Train on synthetic data and evaluate
        run: python -m ml.prepare_datasets --synthetic && python -m ml.train_classifier && python -m ml.evaluate_model
      - name: Unit and API tests
        run: pytest -q
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-resume-screening:${{ github.sha }} .
      # Add: docker login + push to your registry, then deploy (Render/Railway/Fly/AWS) on main.
